name: Load tests (k6)

on:
  workflow_dispatch: {}

concurrency:
  group: load-tests
  cancel-in-progress: true

jobs:
  k6:
    name: smoke + public-reads + auth-flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379
      API_PORT: '4001'
      API_PUBLIC_URL: http://localhost:4001
      API_CORS_ORIGINS: http://localhost:4000
      AUTH_SECRET: load-test-secret-not-for-production-use-only
      AUTH_COOKIE_DOMAIN: localhost
      AUTH_JWT_ACCESS_TTL: '900'
      AUTH_JWT_REFRESH_TTL: '604800'
      # Queues + rate-limit off — auth-flow's 10rps would otherwise
      # hit the per-route limit after ~5s.
      API_DISABLE_QUEUES: 'true'
      API_DISABLE_RATE_LIMIT: 'true'
      # auth-flow.js exercises OTP send; force the stub mailer so we
      # don't try to reach MailHog (which we don't spin up).
      API_DISABLE_MAILER: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Apply migrations
        run: pnpm --filter @repo/db exec prisma migrate deploy

      - name: Build (libs)
        run: pnpm --filter @repo/shared --filter @repo/db --filter @repo/ui --filter @repo/config build

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Start API
        run: |
          pnpm --filter @repo/api dev &
          echo $! > .api.pid
          # Wait for the API to bind. /healthz is the documented
          # readiness probe; same one Playwright's webServer waits on.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4001/healthz > /dev/null; then
              echo "API up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Smoke test
        run: k6 run --summary-export=smoke-summary.json load-tests/smoke.js

      - name: Public reads (50 rps × 2m)
        run: k6 run --summary-export=public-reads-summary.json load-tests/public-reads.js

      - name: Auth flow (10 rps × 1m)
        run: k6 run --summary-export=auth-flow-summary.json load-tests/auth-flow.js

      - name: Stop API
        if: always()
        run: |
          if [ -f .api.pid ]; then
            kill "$(cat .api.pid)" || true
          fi

      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summaries
          path: |
            smoke-summary.json
            public-reads-summary.json
            auth-flow-summary.json
          retention-days: 30
