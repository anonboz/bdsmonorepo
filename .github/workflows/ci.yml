name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Dummy values so module-load-time env reads (@repo/db pool URL, NextAuth
      # secret) don't throw during build. No live DB is touched: pages are
      # force-dynamic and the pg pool connects lazily, so nothing connects here.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-not-a-real-secret-please-ignore-000000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # next-auth@4's React peer range predates React 19 — a known, benign
      # ERESOLVE. --legacy-peer-deps mirrors local dev.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --fund=false

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@repo/db

      - name: Typecheck (all apps)
        run: |
          for app in landlord tenant agent listings admin vendor; do
            echo "::group::typecheck $app"
            npm run typecheck --workspace=$app
            echo "::endgroup::"
          done

      - name: Build (all apps)
        run: |
          for app in landlord tenant agent listings admin vendor; do
            echo "::group::build $app"
            npm run build --workspace=$app
            echo "::endgroup::"
          done
