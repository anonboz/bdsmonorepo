name: Deploy Check

# Phase 9.7: validates that the required prod env-var manifest in
# `scripts/validate-env.ts` is honored by a synthetic "all set"
# env. Catches "forgot to declare a new required var" before it
# silently 500s in prod.
#
# This job runs the *validator*, not the real deploy. Real prod
# secrets live in Vercel + Fly and are checked against the same
# script at deploy time.

on:
  pull_request:
    paths:
      - 'apps/api/src/env.ts'
      - 'scripts/validate-env.ts'
      - '.env.example'
      - '.github/workflows/deploy-check.yml'
  push:
    branches: [main]

jobs:
  validate-env:
    name: validate required env-var manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      # Synthetic "every required var present" env. Values are
      # garbage — the validator only checks presence + non-empty.
      # Adding a new required var without setting it here will
      # surface as a failed deploy-check, prompting the operator
      # to either set it on Vercel/Fly OR remove it from the
      # manifest if it's actually optional.
      - name: Run env validator (production target)
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://ci@example/ci
          REDIS_URL: redis://ci@example
          API_PUBLIC_URL: https://api.example.test
          API_CORS_ORIGINS: https://example.test
          AUTH_SECRET: ci-synthetic-secret-32-bytes-long-xxxxxxx
          AUTH_JWT_ACCESS_TTL: '900'
          AUTH_JWT_REFRESH_TTL: '2592000'
          AUTH_COOKIE_DOMAIN: example.test
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          VNPAY_TMN_CODE: CI_TMN
          VNPAY_HASH_SECRET: ci_vnpay_hash
          VNPAY_PAYMENT_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
          VNPAY_REFUND_URL: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
          TENANT_APP_URL: https://tenant.example.test
          PARTNER_APP_URL: https://partner.example.test
          S3_ENDPOINT: https://s3.example.test
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: ci_access
          S3_SECRET_ACCESS_KEY: ci_secret
          S3_BUCKET_UPLOADS: ci-uploads
          RESEND_API_KEY: re_ci_placeholder
          EMAIL_FROM: 'CI <no-reply@example.test>'
          SENTRY_DSN: https://ci@sentry.io/0
          POSTHOG_KEY: phc_ci_placeholder
          POSTHOG_HOST: https://us.i.posthog.com
        run: pnpm --filter @repo/api exec tsx ../../scripts/validate-env.ts production
